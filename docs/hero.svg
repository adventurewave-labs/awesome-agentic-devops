<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Awesome Agentic DevOps — animated hero: a commit flowing through CI, an AI agent core, Kubernetes and MCP-connected agents">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#131c28" stroke-width="1"/>
    </pattern>
    <radialGradient id="gGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ddc84" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#3ddc84" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58c4dd" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#58c4dd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gMag" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b48ef0" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#b48ef0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="#0a0e14"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect x="-150" y="-120" width="520" height="360" fill="url(#gGreen)"/>
  <rect x="820" y="20" width="420" height="300" fill="url(#gCyan)"/>
  <rect x="380" y="60" width="380" height="260" fill="url(#gMag)"/>

  <!-- title -->
  <text x="48" y="66" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="38" font-weight="700" fill="#e8f0f8" letter-spacing="-1">awesome<tspan fill="#3ddc84">-</tspan><tspan fill="#3ddc84">agentic</tspan><tspan fill="#3ddc84">-</tspan>devops</text>
  <text x="48" y="96" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="15" fill="#7c8b9d">AI agents that reason about, operate, and heal your infrastructure · 150+ curated links</text>

  <!-- ================= pipeline flow line ================= -->
  <path id="flow" d="M70 180 H1130" fill="none" stroke="#1d2836" stroke-width="2"/>
  <path d="M70 180 H1130" fill="none" stroke="#3ddc84" stroke-width="2" stroke-dasharray="7 13" opacity=".85">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <!-- traveling pulse -->
  <circle r="4.5" fill="#eafff3">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M70 180 H1130"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;.06;.9;.97;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="9" fill="none" stroke="#3ddc84" stroke-width="1.5" opacity=".5">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M70 180 H1130"/>
  </circle>

  <!-- node 1: commit -->
  <circle cx="70" cy="180" r="7" fill="#0a0e14" stroke="#7c8b9d" stroke-width="2"/>
  <circle cx="70" cy="180" r="2.6" fill="#7c8b9d"/>
  <text x="70" y="230" text-anchor="middle" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="11" fill="#55657a">commit</text>

  <!-- node 2: CI hex -->
  <g transform="translate(280 180)">
    <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#10151f" stroke="#58c4dd" stroke-width="2"/>
    <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="none" stroke="#58c4dd" stroke-width="1" opacity=".45">
      <animate attributeName="opacity" values=".15;.6;.15" dur="2.4s" repeatCount="indefinite"/>
    </polygon>
    <text x="0" y="4" text-anchor="middle" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="9" fill="#58c4dd">CI</text>
    <text x="0" y="50" text-anchor="middle" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="11" fill="#55657a">ci / cd</text>
  </g>

  <!-- node 3: agent core (pulsing) -->
  <g transform="translate(490 180)">
    <circle r="14" fill="none" stroke="#3ddc84" stroke-width="1.5">
      <animate attributeName="r" values="14;30" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="none" stroke="#3ddc84" stroke-width="1.5">
      <animate attributeName="r" values="14;30" dur="2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="#10151f" stroke="#3ddc84" stroke-width="2.5"/>
    <circle r="5.5" fill="#3ddc84">
      <animate attributeName="fill" values="#3ddc84;#a4f0c8;#3ddc84" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="50" text-anchor="middle" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="11" fill="#55657a">ai agent</text>
  </g>

  <!-- node 4: k8s + radar sweep -->
  <g transform="translate(700 180)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
      <path d="M0 0 L0 -26" stroke="#e8b93e" stroke-width="2" opacity=".8"/>
      <path d="M0 0 A26 26 0 0 1 18 -18 L0 0 Z" fill="#e8b93e" opacity=".18"/>
    </g>
    <polygon points="0,-19 16.5,-9.5 16.5,9.5 0,19 -16.5,9.5 -16.5,-9.5" fill="#0a0e14" stroke="#e8b93e" stroke-width="2"/>
    <circle r="3.4" fill="#e8b93e"/>
    <text x="0" y="50" text-anchor="middle" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="11" fill="#55657a">kubernetes</text>
  </g>

  <!-- node 5: verified deploy -->
  <g transform="translate(880 180)">
    <circle r="16" fill="#10151f" stroke="#3ddc84" stroke-width="2"/>
    <path d="M-6.5 0.5 L-2 5 L7 -5" fill="none" stroke="#3ddc84" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="36 0">
      <animate attributeName="stroke-dasharray" values="0 36;36 0;36 0" keyTimes="0;0.35;1" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="50" text-anchor="middle" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="11" fill="#55657a">deploy ✓</text>
  </g>

  <!-- ================= MCP orbit cluster ================= -->
  <g transform="translate(1060 180)">
    <circle r="62" fill="none" stroke="#1d2836" stroke-width="1.5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
      <circle r="62" fill="none" stroke="#b48ef0" stroke-width="1.5" stroke-dasharray="4 14" opacity=".9"/>
      <circle cx="62" cy="0" r="5" fill="#3ddc84"/>
      <circle cx="-31" cy="53.7" r="5" fill="#58c4dd"/>
      <circle cx="-31" cy="-53.7" r="5" fill="#e8b93e"/>
    </g>
    <polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="#10151f" stroke="#b48ef0" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="10" font-weight="700" fill="#b48ef0">MCP</text>
    <text x="0" y="88" text-anchor="middle" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="11" fill="#55657a">protocols</text>
  </g>

  <!-- ================= terminal strip ================= -->
  <rect x="48" y="240" width="600" height="40" rx="8" fill="#10151f" stroke="#1d2836"/>
  <circle cx="68" cy="252" r="3" fill="#e07a6b"/>
  <circle cx="80" cy="252" r="3" fill="#e8b93e"/>
  <circle cx="92" cy="252" r="3" fill="#3ddc84"/>
  <text x="112" y="266" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" fill="#7c8b9d"><tspan fill="#3ddc84">$</tspan> agentic-devops run <tspan fill="#58c4dd">--autonomous</tspan> <tspan fill="#b48ef0">--guarded</tspan> <tspan fill="#e8b93e">--audit</tspan></text>
  <rect x="524" y="255" width="9" height="16" fill="#3ddc84">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.5;.5;.99;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- corner meta -->
  <text x="1152" y="62" text-anchor="end" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="11" fill="#55657a">curated · link-verified 2026-10-17</text>
</svg>
